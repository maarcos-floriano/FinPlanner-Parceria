version: '3.9'

services:
  postgres:
    image: postgres:14
    container_name: finplanner-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: finplanner
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d finplanner"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: santthiago/finplanner-back:latest
    # container_name: finplanner-back
    # build:
      # context: ../back
    restart: always
    env_file:
      - ../back/.env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5000:5000"
    # volumes:
    #   - ../back:/app
    # command: npm run dev
    command: npm start

  # frontend:
  #   container_name: finplanner-front
  #   build:
  #     context: ../front
  #   restart: always
  #   depends_on:
  #     - backend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ../front:/app
  #   command: npm run dev

volumes:
  postgres_data: